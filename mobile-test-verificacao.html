<!doctype html><html lang="pt-br"><meta charset="utf-8"><title>Validação da prévia móvel</title><style>body{font:14px system-ui;background:#181818;color:white}iframe{width:390px;height:700px;border:3px solid #777}pre{white-space:pre-wrap}</style><h1>Validação da prévia móvel</h1><p id="status">Executando...</p><iframe id="view" src="construction-preview-v2.html?validation=6" title="Prévia 390px"></iframe><pre id="results"></pre><script>
const f=document.querySelector('#view'),out=document.querySelector('#results'),status=document.querySelector('#status');
function sleep(n){return new Promise(r=>setTimeout(r,n))}
f.onload=async()=>{const w=f.contentWindow,d=f.contentDocument;const failures=[];let errors=[];w.addEventListener('error',e=>errors.push(e.message));await sleep(1500);d.documentElement.style.scrollBehavior='auto';const canvas=d.querySelector('.construction-overlay.mobile-timeline');if(!canvas){status.textContent='FALHOU: overlay mobile não carregado';return}
const targets=['#servicos .section-head','#projetos .section-head','#como-funciona .section-head','#sobre .about-photo','#sobre #about-title','#sobre .about-note','#sobre .complex-cta','[aria-labelledby="faq-title"] .section-head','#contato .contact-inner'].map(s=>d.querySelector(s));
const samples=[];let seen=new Set(),inside=true;for(let y=0,limit=d.documentElement.scrollHeight-w.innerHeight;y<=limit;y+=45){w.scrollTo(0,y);await sleep(12);let cursor=d.querySelector('.construction-cursor'),label=d.querySelector('.construction-label'),rect=d.querySelector('.construction-outline');if(cursor.getAttribute('opacity')==='1'){let match=label.textContent.match(/(\d+)\/(\d+)$/),i=match?+match[1]-1:-1;let tr=cursor.getAttribute('transform')||'',m=tr.match(/translate\(([-.\d]+) ([-.\d]+)\)/),b=i>=0&&targets[i]?.getBoundingClientRect();if(i>=0){seen.add(i);if(b&&!(b.bottom>12&&b.top<w.innerHeight-100))failures.push('Ativo fora da tela '+i+' y='+y)}if(m){let x=+m[1],yy=+m[2];if(x<0||x>w.innerWidth-20||yy<0||yy>w.innerHeight-20){inside=false;failures.push('Cursor fora '+x+','+yy)}}samples.push({y,label:label.textContent,tr,stroke:rect.getAttribute('stroke-dashoffset'),text:d.querySelector('.construction-code').textContent})}}
let reverse=[];for(const q of samples.filter((_,i)=>i%35===0).reverse()){w.scrollTo(0,q.y);await sleep(40);let c=d.querySelector('.construction-cursor'),r=d.querySelector('.construction-outline'),text=d.querySelector('.construction-code');if(c.getAttribute('transform')!==q.tr||r.getAttribute('stroke-dashoffset')!==q.stroke||text.textContent!==q.text)reverse.push(q.y)}
const wrappers=d.querySelectorAll('.construction-mobile-scene').length;out.textContent=JSON.stringify({largura:w.innerWidth,altura:w.innerHeight,alturaPagina:d.documentElement.scrollHeight,etapasAtivas:[...seen],quadrosComCursor:samples.length,cursorDentroDaTela:inside,verificacoesReversasDiferentes:reverse,wrappersDeEspacoExtra:wrappers,erros:errors,problemas:failures.slice(0,15)},null,2);status.textContent=(failures.length||errors.length||!samples.length||reverse.length||wrappers?'FALHOU':'PASSOU: simulação mobile');};
</script></html>
