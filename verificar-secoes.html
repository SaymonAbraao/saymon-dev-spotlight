<!doctype html><html><meta charset="utf-8"><style>body{background:#111;color:white;font:15px system-ui}iframe{width:390px;height:740px}pre{white-space:pre-wrap}</style><h1>Teste responsivo</h1><p id="report">Carregando</p><pre id="log"></pre><iframe title="Prévia mobile"></iframe><script>
const f=document.querySelector('iframe'),log=document.querySelector('#log'),report=document.querySelector('#report'),pause=ms=>new Promise(r=>setTimeout(r,ms));const failures=[],results=[];
f.onload=async()=>{try{const w=f.contentWindow,d=f.contentDocument;w.addEventListener('error',e=>failures.push(e.message));const entries=['#inicio','#servicos','#projetos','#como-funciona','#sobre','[aria-labelledby="faq-title"]','#contato','footer'];for(let i=0;i<entries.length;i++){const root=d.querySelector(entries[i]);if(i){root.scrollIntoView({block:'start',behavior:'instant'});await pause(350);w.dispatchEvent(new w.Event('scroll'))}let deadline=Date.now()+18000;while(Date.now()<deadline){const pending=root.querySelectorAll('.build-wait').length;const cursor=d.querySelector('.build-svg g');if(!pending&&cursor?.getAttribute('opacity')==='0')break;await pause(250)}await pause(1800);let pending=root.querySelectorAll('.build-wait').length;results.push({section:entries[i],hidden:pending,scroll:w.scrollY});if(pending)failures.push('Itens ocultos '+entries[i]+': '+pending);log.textContent=JSON.stringify({results,failures},null,2)}await pause(1000);report.textContent='Concluído';log.textContent=JSON.stringify({results,failures,cursorRestante:!!d.querySelector('.build-svg'),botaoRestante:!!d.querySelector('.build-skip')},null,2)}catch(error){report.textContent='Erro teste';log.textContent=String(error.stack||error)}};f.src='construcao-por-secao.html?teste=mobile-a';
</script></html>
