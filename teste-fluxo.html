<!doctype html><html lang="pt-br"><meta charset="utf-8"><title>Teste de construção</title><style>body{background:#171917;color:white;font:15px system-ui}iframe{width:390px;height:740px;border:1px solid #aaa}pre{white-space:pre-wrap}</style><h1>Verificação automática</h1><p id="status">Executando</p><pre id="out"></pre><script>sessionStorage.removeItem("saymonBuildComplete");</script><iframe title="Prévia móvel"></iframe><script>
const f=document.querySelector('iframe'),status=document.querySelector('#status'),out=document.querySelector('#out');const sleep=ms=>new Promise(r=>setTimeout(r,ms));
f.onload=async()=>{let w=f.contentWindow,d=f.contentDocument,errors=[];w.addEventListener('error',e=>errors.push(e.message));let init=d.querySelectorAll('.build-wait,.build-shell-wait').length,seen=new Set(),missing=0,early=0;out.textContent=JSON.stringify({init,reduced:w.matchMedia('(prefers-reduced-motion: reduce)').matches,skip:!!d.querySelector('.build-skip')});
for(let i=0;i<2400&&d.querySelector('.build-skip');i++){let evt=new w.KeyboardEvent('keydown',{key:'PageDown',bubbles:true,cancelable:true});let allowed=d.body.dispatchEvent(evt);if(allowed)w.scrollBy(0,110);await sleep(80);let el=d.querySelector('.build-svg'),c=el?.querySelector('g');if(c&&c.getAttribute('opacity')==='1'){let tr=c.getAttribute('transform');let m=tr?.match(/translate\(([-.\d]+) ([-.\d]+)\)/);if(m&&(+m[1]<0||+m[1]>w.innerWidth||+m[2]<0||+m[2]>w.innerHeight))missing++;seen.add(d.querySelectorAll('.build-wait,.build-shell-wait').length)}if(!d.querySelector('.build-skip')&&d.querySelectorAll('.build-wait,.build-shell-wait').length)early++;if(i%50===0)out.textContent=JSON.stringify({ciclo:i,elementosInicial:init,restantes:d.querySelectorAll('.build-wait,.build-shell-wait').length,etapasObservadas:seen.size,erros},null,2)}
status.textContent='Concluído';out.textContent=JSON.stringify({elementosInicial:init,restantes:d.querySelectorAll('.build-wait,.build-shell-wait').length,etapasObservadas:seen.size,cursorFora:missing,terminoComPendentes:early,finalizou:!d.querySelector('.build-skip'),posicao:w.scrollY,altura:w.innerHeight,total:d.documentElement.scrollHeight,erros},null,2);
}; f.src="fluxo-de-construcao.html?teste=mobile2";</script></html>
